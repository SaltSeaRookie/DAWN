<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>晨曦大陸 Dawnlands</title>
<link rel="stylesheet" href="css/style.css?v=2.4.0">
</head>
<body class="in-scene">
<canvas id="game"></canvas>

<div id="audioCtl">
  <button id="btnMusic" class="actl"><span>♪</span><em>音樂</em></button>
  <button id="btnSfx" class="actl"><span>🔊</span><em>音效</em></button>
</div>

<!-- ===== 登入 ===== -->
<div id="login" class="scene">
  <div class="tablet">
    <div class="crest">✦</div>
    <h1>晨曦大陸</h1>
    <div class="sub">DAWNLANDS</div>
    <form id="loginForm" autocomplete="on">
      <label><span>帳號</span><input id="lAccount" name="username" autocomplete="username" maxlength="16" placeholder="3～16 個英數字"></label>
      <label><span>密碼</span><input id="lPassword" name="password" type="password" autocomplete="current-password" maxlength="32" placeholder="至少 4 個字元"></label>
      <div id="loginMsg" class="msg"></div>
      <button type="submit" class="btn big">登入遊戲</button>
      <div class="btnrow">
        <button type="button" id="btnRegister" class="btn">建立新帳號</button>
        <button type="button" id="btnQuit" class="btn">離開</button>
      </div>
    </form>
    <div class="note"><span class="verLabel"></span>・本機模式：帳號與角色儲存在這台裝置的瀏覽器中，<br>沒有帳號時輸入新的帳號密碼即可建立。</div>
  </div>
</div>

<!-- ===== 選擇角色 ===== -->
<div id="select" class="scene">
  <div class="sel-title">選擇角色</div>
  <div id="slotPicks"></div>
  <div class="sel-panel">
    <div id="charInfo"></div>
    <div class="sel-btns">
      <button id="btnEnter" class="btn big">進入遊戲</button>
      <button id="btnNewChar" class="btn">建立角色</button>
      <button id="btnDelChar" class="btn">刪除角色</button>
      <div class="btnrow tight"><button id="btnImport" class="btn sm">匯入角色</button><button id="btnBackupAll" class="btn sm">備份全部</button></div>
      <button id="btnLogout" class="btn link">登出帳號</button>
    </div>
  </div>
</div>

<!-- ===== 建立角色 ===== -->
<div id="create" class="scene">
  <div class="create-box">
    <div class="sel-title">建立角色</div>
    <div id="cClasses"></div>
    <div id="cDesc" class="cdesc"></div>
    <div class="create-cols">
      <div>
        <label class="lbl">角色名稱</label>
        <input id="cName" maxlength="8" placeholder="2～8 個字">
        <div id="cStart" class="dim small"></div>
        <div class="lbl">能力值　剩餘點數 <b id="cBonus"></b></div>
        <div id="cStats"></div>
      </div>
      <div>
        <div class="lbl">初始數值</div>
        <div id="cDerived"></div>
        <div class="dim small">力量：近戰傷害與命中・敏捷：遠程、迴避與防禦・體質：體力與負重・智力：魔法攻擊・精神：魔力與魔法防禦・魅力：血盟招募</div>
      </div>
    </div>
    <div id="cMsg" class="msg"></div>
    <div class="btnrow center">
      <button id="btnCreateOk" class="btn big">確認建立</button>
      <button id="btnCreateCancel" class="btn">取消</button>
    </div>
  </div>
</div>

<!-- ===== 遊戲 HUD ===== -->
<div id="zoneBanner"></div>
<div id="siegeBar"></div>
<div id="buffs"></div>
<div id="minimapWrap"><canvas id="minimap" width="200" height="130"></canvas></div>
<div id="hud">
  <div id="hudTop">
    <span id="zoneLabel"></span>
    <span id="zoneType" class="safe"></span>
  </div>
  <div id="hudL" class="panel">
    <div class="lvbox"><div id="expFill"></div><span id="lvText">Lv.1</span><span id="expText">0%</span></div>
    <div class="pair">
      <div class="stat" title="防禦力"><i>🛡</i><span>AC</span><b id="acText">0</b></div>
      <div class="stat" title="魔法防禦"><i>✧</i><span>MR</span><b id="mrText">0</b></div>
    </div>
    <div class="pair">
      <div class="stat wt" title="負重"><div id="wtFill"></div><i>⚖</i><span>負重</span><b id="wtText">0%</b></div>
      <div class="stat" title="金幣"><i>●</i><span>金</span><b id="goldText">0</b></div>
    </div>
    <div class="honor" title="善惡值"><div id="alignFill"></div><span id="alignName">中立</span><b id="alignText">0</b></div>
    <div class="day" title="時間"><span id="dayIcon">☀</span><div class="daybar"><div id="dayFill"></div></div></div>
  </div>
  <div id="hudC" class="panel">
    <div class="bars">
      <div class="bar hp"><div id="hpFill"></div><span id="hpText">HP</span></div>
      <div class="emblem"></div>
      <div class="bar mp"><div id="mpFill"></div><span id="mpText">MP</span></div>
    </div>
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="按 Enter 聊天…" maxlength="60" autocomplete="off">
  </div>
  <div id="hudR" class="panel">
    <div id="hotbar"></div>
    <div class="menu">
      <button id="btnInv" title="背包 (Tab / I)">背包</button>
      <button id="btnChar" title="角色 (C)">角色</button>
      <button id="btnSpell" title="魔法 (S)">魔法</button>
      <button id="btnPet" title="夥伴 (T)">夥伴</button>
      <button id="btnClan" title="血盟 (P)">血盟</button>
      <button id="btnMap" title="世界地圖 (M)">地圖</button>
      <button id="btnSet" title="設定 (O)">設定</button>
    </div>
  </div>
</div>

<div id="updateBar"></div>
<div id="windows"></div>
<div id="tip"></div>

<div id="death" class="overlay">
  <div class="box">
    <h2>你死了</h2>
    <p id="deathMsg" class="dim"></p>
    <button id="btnRespawn" class="btn big">回到村莊</button>
  </div>
</div>

<script src="js/version.js?v=2.4.0"></script>
<script src="assets/music/theme.js?v=2.4.0"></script>
<script src="js/util.js?v=2.4.0"></script>
<script src="js/data.js?v=2.4.0"></script>
<script src="js/net.js?v=2.4.0"></script>
<script src="js/world.js?v=2.4.0"></script>
<script src="js/assets.js?v=2.4.0"></script>
<script src="js/sprites.js?v=2.4.0"></script>
<script src="js/audio.js?v=2.4.0"></script>
<script src="js/render.js?v=2.4.0"></script>
<script src="js/companions.js?v=2.4.0"></script>
<script src="js/backup.js?v=2.4.0"></script>
<script src="js/chat.js?v=2.4.0"></script>
<script src="js/ui.js?v=2.4.0"></script>
<script src="js/scenes.js?v=2.4.0"></script>
<script src="js/game.js?v=2.4.0"></script>
</body>
</html>
